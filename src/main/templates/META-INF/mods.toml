modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Wxrlds/BeetifulGarden"

# Beetiful Garden
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Wxrlds/BeetifulGarden"
authors = "${mod_authors}"
description = '''${mod_description}'''

# NeoForge
[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

# Minecraft
[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Curios
[[dependencies.${ mod_id }]]
modId = "curios"
type = "optional"
versionRange = "[7,)"
ordering = "AFTER"
side = "BOTH"

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Wxrlds/BeetifulGarden"

# Beetiful Garden
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Wxrlds/BeetifulGarden"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Forge
[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

# Minecraft
[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Curios
[[dependencies.${ mod_id }]]
modId = "curios"
mandatory = false
versionRange = "[1.16.5-4,)"
ordering = "AFTER"
side = "BOTH"
